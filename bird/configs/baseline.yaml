condition: baseline

agent:
  model: "MODEL_NAME"
  temperature: 0.0
  max_turns: 30
  provider: "openai"
  base_url: ""
  api_key_env: "BIRD_AGENT_API_KEY"

semantic:
  enabled: false
  store_path: ""

mcp_servers:
  - name: sqlite
    module: "tool_server.sqlite_mcp"
    description: "SQLite database exploration tools"
    args:
      - "--db-path"
      - ""
